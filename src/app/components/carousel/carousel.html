<section class="relative h-[600px] overflow-hidden bg-gray-900 mt-[72px]">
  <!-- Slides -->
  <div class="relative h-full">
    @for (event of featuredEvents; track event.id; let i = $index) {
      <div 
        class="absolute inset-0 transition-opacity duration-700"
        [class.opacity-100]="currentSlide === i"
        [class.opacity-0]="currentSlide !== i"
        [class.pointer-events-none]="currentSlide !== i">
        
        <!-- Imagem de fundo -->
        <div class="absolute inset-0 bg-cover bg-center" [style.background-image]="'url(' + event.imageUrl + ')'">
          <!-- Overlay escuro -->
          <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/60 to-transparent"></div>
        </div>

        <!-- Conteúdo -->
        <div class="container mx-auto px-6 h-full relative z-10">
          <div class="flex items-center h-full">
            <div class="max-w-2xl space-y-6">
              <!-- Badge de categoria -->
              <div class="inline-block">
                <span class="px-4 py-2 text-white text-sm font-semibold rounded-lg" style="background-color: #13E785;">
                  {{ event.category }}
                </span>
              </div>

              <!-- Título -->
              <h1 class="text-5xl md:text-6xl font-bold text-white leading-tight">
                {{ event.title }}
              </h1>

              <!-- Subtítulo -->
              <p class="text-xl md:text-2xl text-gray-200">
                {{ event.subtitle }}
              </p>

              <!-- Informações -->
              <div class="flex flex-col sm:flex-row gap-4 text-white">
                <div class="flex items-center space-x-2">
                  <lucide-icon [img]="Calendar" [size]="20"></lucide-icon>
                  <span>{{ event.date }}</span>
                </div>
                <div class="flex items-center space-x-2">
                  <lucide-icon [img]="MapPin" [size]="20"></lucide-icon>
                  <span>{{ event.location }}</span>
                </div>
              </div>

              <!-- Preço e botão -->
              <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 pt-4">
                <div class="text-white">
                  <p class="text-sm text-gray-300">Ingressos</p>
                  <p class="text-2xl font-bold">{{ event.price }}</p>
                </div>
                <button class="bg-white/20 backdrop-blur-md hover:bg-white/30 text-white px-6 py-2 rounded-lg font-semibold transition flex items-center space-x-2 border border-white/30 shadow-xl">
                  <span>Ver Mais</span>
                  <lucide-icon [img]="ArrowRight" [size]="18"></lucide-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Botões de navegação -->
  <button 
    (click)="prevSlide()"
    class="absolute left-6 top-1/2 -translate-y-1/2 z-20 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white p-3 rounded-full transition border border-white/20">
    <lucide-icon [img]="ChevronLeft" [size]="24"></lucide-icon>
  </button>
  
  <button 
    (click)="nextSlide()"
    class="absolute right-6 top-1/2 -translate-y-1/2 z-20 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white p-3 rounded-full transition border border-white/20">
    <lucide-icon [img]="ChevronRight" [size]="24"></lucide-icon>
  </button>

  <!-- Indicadores -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex space-x-3">
    @for (event of featuredEvents; track event.id; let i = $index) {
      <button
        (click)="goToSlide(i)"
        class="transition-all duration-300"
        [class.w-12]="currentSlide === i"
        [class.w-3]="currentSlide !== i"
        [class.bg-white]="currentSlide === i"
        [class.bg-white/40]="currentSlide !== i"
        class="h-3 rounded-full">
      </button>
    }
  </div>
</section>
