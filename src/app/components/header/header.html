<header class="fixed w-full top-0 z-50 bg-gray-900/95 backdrop-blur-md shadow-lg border-b border-white/10">
  <nav class="px-4 md:px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-2 cursor-pointer flex-shrink-0" (click)="navigateToHome()">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background-color: #10B981;">
          <span class="text-white font-bold text-xl">V</span>
        </div>
        <span class="text-xl md:text-2xl font-bold text-white">Vingo</span>
      </div>
      
      <!-- Busca Desktop (oculta em mobile) -->
      <div class="hidden lg:flex flex-grow justify-center px-6">
        <div class="relative w-full max-w-2xl">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <lucide-icon [img]="Search" class="text-gray-400" [size]="20"></lucide-icon>
          </div>
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="onSearch()"
            placeholder="Buscar eventos..."
            class="w-full pl-12 pr-4 py-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:border-transparent transition"
            style="focus:ring-color: #10B981;"
          />
          @if (searchQuery) {
            <button
              (click)="clearSearch()"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white"
            >
              <lucide-icon [img]="X" [size]="20"></lucide-icon>
            </button>
          }
        </div>
      </div>
      
      <!-- Ações Desktop -->
      <div class="hidden lg:flex items-center space-x-4 flex-shrink-0">
        @if (!isLoggedIn) {
          <button 
            (click)="navigateToLogin()"
            class="text-gray-300 hover:text-white transition whitespace-nowrap"
          >
            Entrar
          </button>
          <button 
            (click)="navigateToRegister()"
            class="text-white px-6 py-2 rounded-lg transition hover:opacity-90 whitespace-nowrap" 
            style="background-color: #10B981;"
          >
            Cadastrar
          </button>
        } @else {
          <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 text-gray-300">
              <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: #10B981;">
                <lucide-icon [img]="User" [size]="18" class="text-white"></lucide-icon>
              </div>
              <span class="font-medium whitespace-nowrap">{{ userName }}</span>
            </div>
            
            <button 
              (click)="navigateToMyTickets()"
              class="flex items-center space-x-2 text-white px-4 py-2 rounded-lg transition hover:opacity-90 whitespace-nowrap"
              style="background-color: #10B981;"
            >
              <lucide-icon [img]="Ticket" [size]="18"></lucide-icon>
              <span>Meus Ingressos</span>
            </button>
            
            <button 
              (click)="logout()"
              class="flex items-center space-x-2 text-gray-300 hover:text-white transition"
              title="Sair"
            >
              <lucide-icon [img]="LogOut" [size]="20"></lucide-icon>
              <span>Sair</span>
            </button>
          </div>
        }
      </div>

      <!-- Botão Menu Hambúrguer (Mobile) -->
      <button 
        (click)="toggleMenu()"
        class="lg:hidden text-white p-2 hover:bg-gray-800 rounded-lg transition"
        [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
      >
        @if (!menuOpen) {
          <lucide-icon [img]="Menu" [size]="24"></lucide-icon>
        } @else {
          <lucide-icon [img]="X" [size]="24"></lucide-icon>
        }
      </button>
    </div>

    <!-- Menu Mobile -->
    @if (menuOpen) {
      <div class="lg:hidden mt-4 pb-4 border-t border-gray-700 pt-4 animate-slideDown">
        <!-- Busca Mobile -->
        <div class="mb-4">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <lucide-icon [img]="Search" class="text-gray-400" [size]="20"></lucide-icon>
            </div>
            <input
              type="text"
              [(ngModel)]="searchQuery"
              (input)="onSearch()"
              placeholder="Buscar eventos..."
              class="w-full pl-12 pr-4 py-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:border-transparent transition"
              style="focus:ring-color: #10B981;"
            />
          </div>
        </div>

        <!-- Links Mobile -->
        <div class="space-y-2">
          @if (!isLoggedIn) {
            <button 
              (click)="navigateToLogin(); toggleMenu()"
              class="w-full text-left px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800 rounded-lg transition"
            >
              Entrar
            </button>
            <button 
              (click)="navigateToRegister(); toggleMenu()"
              class="w-full text-white px-4 py-3 rounded-lg transition hover:opacity-90" 
              style="background-color: #10B981;"
            >
              Cadastrar
            </button>
          } @else {
            <div class="px-4 py-3 border-b border-gray-700">
              <div class="flex items-center space-x-2 text-gray-300">
                <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: #10B981;">
                  <lucide-icon [img]="User" [size]="18" class="text-white"></lucide-icon>
                </div>
                <span class="font-medium">{{ userName }}</span>
              </div>
            </div>
            
            <button 
              (click)="navigateToMyTickets(); toggleMenu()"
              class="w-full flex items-center space-x-2 px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800 rounded-lg transition"
            >
              <lucide-icon [img]="Ticket" [size]="18"></lucide-icon>
              <span>Meus Ingressos</span>
            </button>
            
            <button 
              (click)="logout(); toggleMenu()"
              class="w-full flex items-center space-x-2 px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800 rounded-lg transition"
            >
              <lucide-icon [img]="LogOut" [size]="20"></lucide-icon>
              <span>Sair</span>
            </button>
          }
        </div>
      </div>
    }
  </nav>
</header>
