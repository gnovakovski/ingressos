<div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-lg">
  <h2 class="text-2xl font-bold mb-4">Comprar Ingresso</h2>
  <p class="text-gray-600 mb-6">{{ eventTitle }}</p>

  @if (success) {
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      Compra realizada com sucesso!
    </div>
  }

  @if (error) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>
  }

  <form (ngSubmit)="purchaseTicket()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Nome</label>
      <input
        type="text"
        [(ngModel)]="buyerName"
        name="buyerName"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
      <input
        type="email"
        [(ngModel)]="buyerEmail"
        name="buyerEmail"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Quantidade</label>
      <input
        type="number"
        [(ngModel)]="quantity"
        name="quantity"
        min="1"
        [max]="availableTickets"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        required
      />
      <p class="text-sm text-gray-500 mt-1">Disponível: {{ availableTickets }}</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <span class="text-lg font-semibold">Total:</span>
        <span class="text-2xl font-bold text-purple-600">R$ {{ totalPrice.toFixed(2) }}</span>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition disabled:opacity-50"
    >
      {{ loading ? 'Processando...' : 'Confirmar Compra' }}
    </button>
  </form>
</div>
